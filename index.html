<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raptakos, Brett & Co. Ltd. DBMS</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --primary-color: #0071e3;
      --primary-hover: #0077ed;
      --text-color: #1d1d1f;
      --secondary-text: #86868b;
      --border-color: #d2d2d7;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Apple-style Loader */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s;
    }

    .apple-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      color: #86868b;
      margin-top: 15px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* Header */
    header {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img {
      height: 40px;
      object-fit: contain;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    /* Main Container */
    main {
      max-width: 900px;
      width: 100%;
      margin: 30px auto;
      padding: 0 20px;
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    /* Buttons & City Selection */
    .btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #e8e8ed;
      color: var(--text-color);
    }

    .btn-secondary:hover {
      background: #dcdce0;
    }

    .city-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .city-btn {
      background: #e8e8ed;
      color: var(--text-color);
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .city-btn:hover, .city-btn.active {
      background: var(--primary-color);
      color: #fff;
    }

    /* Doctor Table / List */
    .doctor-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .doctor-table th, .doctor-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .doctor-table th {
      font-weight: 600;
      color: var(--secondary-text);
      font-size: 13px;
      text-transform: uppercase;
    }

    .doc-name-btn {
      background: none;
      border: none;
      color: var(--primary-color);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
    }

    .doc-name-btn:hover {
      text-decoration: underline;
    }

    .visit-badge {
      display: inline-block;
      background: #e3f2fd;
      color: #0d47a1;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      width: 90%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
      animation: modalUp 0.3s ease-out;
    }

    @keyframes modalUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      font-size: 18px;
    }

    .close-btn {
      background: #e8e8ed;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 16px;
    }

    .details-list {
      list-style: none;
      margin-bottom: 20px;
      max-height: 300px;
      overflow-y: auto;
    }

    .details-list li {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .details-list span.key {
      color: var(--secondary-text);
      font-weight: 500;
    }

    .details-list span.val {
      text-align: right;
    }

    /* Calendar Form */
    .calendar-form label {
      display: block;
      font-size: 14px;
      color: var(--secondary-text);
      margin-bottom: 6px;
    }

    .calendar-form input[type="date"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
    }

    .saved-visits-list {
      margin-top: 10px;
      max-height: 120px;
      overflow-y: auto;
    }

    .saved-visit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f7;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
    }
  </style>
</head>

  <!-- Apple Loading Screen -->

  </div>

  <!-- Header -->
  <header>
    <img src="logo.png" alt="Logo" id="company-logo" onerror="this.src='https://via.placeholder.com/120x40?text=Raptakos+Logo'">
    <h1>Raptakos, Brett & Co. Ltd. DBMS</h1>

  <main>

    <div class="card" id="city-card">

    </div>

    <!-- Doctor List Section -->
    <div class="card" id="doctor-card" style="display: none;">

        </thead>
        <tbody id="doctor-tbody"></tbody>
      </table>
    </div>
  </main>

  <!-- Details Modal -->
  <div class="modal-overlay" id="details-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-doc-name">Doctor Details</h3>
        <button class="close-btn" onclick="closeModal('details-modal')">&times;</button>
      </div>
      <ul class="details-list" id="modal-details-content"></ul>
      <button class="btn btn-secondary" style="width: 100%; justify-content: center;" onclick="closeModal('details-modal')">Close</button>
    </div>
  </div>

  <!-- Calendar / Visit Entry Modal -->
  <div class="modal-overlay" id="calendar-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="cal-doc-name">Log Doctor Visit</h3>
        <button class="close-btn" onclick="closeModal('calendar-modal')">&times;</button>
      </div>
      <form class="calendar-form" id="visit-form">
        <label for="visit-date">Select Visit Date:</label>
        <input type="date" id="visit-date" required>
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Save Visit Date</button>
      </form>
      
      <div style="margin-top: 20px;">
        <h4 style="font-size: 14px; margin-bottom: 8px;">Logged Visits:</h4>
        <div class="saved-visits-list" id="saved-visits-container"></div>
      </div>
    </div>
  </div>

    let selectedDoctorId = null;

    // Simulate Apple TV Loading Effect
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader-wrapper');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
        setupCitySelection();
      }, 1000);
    });

    // Populate City Buttons
    function setupCitySelection() {
      const cityContainer = document.getElementById('city-buttons');
      cityContainer.innerHTML = '';

      const cities = [...new Set(globalData.map(row => row['City']).filter(Boolean))].sort();

      cities.forEach(city => {
        const btn = document.createElement('button');
        btn.className = 'city-btn';
        btn.textContent = city;
        btn.onclick = () => {
          document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          displayDoctors(city);
        };
        cityContainer.appendChild(btn);
      });
    }

    // Display Doctor List Filtered by City
    function displayDoctors(city) {
      const tbody = document.getElementById('doctor-tbody');
      tbody.innerHTML = '';

      const filtered = globalData.filter(row => row['City'] === city);

      filtered.forEach((doc, index) => {
        const docName = doc['Doctor Name'] || `Doctor ${index + 1}`;
        const docId = `${city}_${docName}`.replace(/\s+/g, '_');

        const tr = document.createElement('tr');

        // Serial No
        const tdIndex = document.createElement('td');
        tdIndex.textContent = index + 1;

        // Name Button + Saved Visit Badges
        const tdName = document.createElement('td');
        const nameBtn = document.createElement('button');
        nameBtn.className = 'doc-name-btn';
        nameBtn.textContent = docName;
        nameBtn.onclick = () => openCalendarModal(docId, docName);

        const visits = getVisits(docId);
        tdName.appendChild(nameBtn);
        if (visits.length > 0) {
          const badge = document.createElement('div');
          badge.className = 'visit-badge';
          badge.textContent = `Last Visited: ${visits[visits.length - 1]}`;
          tdName.appendChild(badge);
        }

        // Details Button
        const tdAction = document.createElement('td');
        const detailsBtn = document.createElement('button');
        detailsBtn.className = 'btn btn-secondary';
        detailsBtn.textContent = 'Details';
        detailsBtn.onclick = () => openDetailsModal(doc);
        tdAction.appendChild(detailsBtn);

        tr.appendChild(tdIndex);
        tr.appendChild(tdName);
        tr.appendChild(tdAction);
        tbody.appendChild(tr);
      });

      document.getElementById('doctor-list-title').textContent = `Doctors in ${city} (${filtered.length})`;
      document.getElementById('doctor-card').style.display = 'block';
    }

    // Modal: Open Details
    function openDetailsModal(doc) {
      const content = document.getElementById('modal-details-content');
      content.innerHTML = '';

      Object.entries(doc).forEach(([key, val]) => {
        if (val !== undefined && val !== null && val !== '') {
          const li = document.createElement('li');
          li.innerHTML = `<span class="key">${key}:</span> <span class="val">${val}</span>`;
          content.appendChild(li);
        }
      });

      document.getElementById('details-modal').classList.add('open');
    }

    // Modal: Open Calendar / Log Visit
    function openCalendarModal(docId, docName) {
      selectedDoctorId = docId;
      document.getElementById('cal-doc-name').textContent = `Log Visit: ${docName}`;
      renderSavedVisits();
      document.getElementById('calendar-modal').classList.add('open');
    }

    // Handle Form Submit (Save Visit Permanently in LocalStorage)
    document.getElementById('visit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const dateVal = document.getElementById('visit-date').value;
      if (!dateVal || !selectedDoctorId) return;

      const visits = getVisits(selectedDoctorId);
      visits.push(dateVal);
      localStorage.setItem(`visits_${selectedDoctorId}`, JSON.stringify(visits));

      document.getElementById('visit-date').value = '';
      renderSavedVisits();

      // Refresh doctor list to update badges
      const activeCityBtn = document.querySelector('.city-btn.active');
      if (activeCityBtn) activeCityBtn.click();
    });

    function getVisits(docId) {
      const saved = localStorage.getItem(`visits_${docId}`);
      return saved ? JSON.parse(saved) : [];
    }

    function renderSavedVisits() {
      const container = document.getElementById('saved-visits-container');
      container.innerHTML = '';
      const visits = getVisits(selectedDoctorId);

      if (visits.length === 0) {
        container.innerHTML = '<p style="font-size: 12px; color: var(--secondary-text);">No visits logged yet.</p>';
        return;
      }

      visits.forEach((v, idx) => {
        const item = document.createElement('div');
        item.className = 'saved-visit-item';
        item.innerHTML = `<span>Visit ${idx + 1}: <strong>${v}</strong></span>`;
        container.appendChild(item);
      });
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }
  </script>
