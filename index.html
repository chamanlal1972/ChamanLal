  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary-color: #0a84ff;
      --primary-hover: #409cff;
      --text-color: #f5f5f7;
      --secondary-text: #98989d;
      --border-color: rgba(255, 255, 255, 0.15);
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(circle at 50% 0%, #1c1c1e 0%, #000000 70%);
    }

    /* Apple TV Style Loading Bar */
    #loader-wrapper {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    .tv-loader-track {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .tv-loader-bar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 3px;
      animation: tvLoad 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes tvLoad {
      0% { left: -100%; }
      50% { left: 0%; }
      100% { left: 100%; }
    }

    /* Header with iOS 7 Liquid Glass */
    header {
      background: rgba(20, 20, 22, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img {
      height: 38px;
      object-fit: contain;
      border-radius: 6px;
    }

    header h1 {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #f5f5f7;
    }

    /* Main Container */
    main {
      max-width: 920px;
      width: 100%;
      margin: 35px auto;
      padding: 0 20px;
      flex: 1;
    }

    /* Liquid Glass Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    h2 {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #f5f5f7;
    }

    /* Buttons & City Selection */
    .btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: scale(1.02);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .city-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .city-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .city-btn:hover, .city-btn.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: #fff;
      box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4);
    }

    /* Doctor Table / List */
    .doctor-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .doctor-table th, .doctor-table td {
      padding: 15px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .doctor-table th {
      font-weight: 600;
      color: var(--secondary-text);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Doctor Name Button (Apple Pill Button style) */
    .doc-name-btn {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f5f5f7;
      font-size: 15px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
      display: inline-block;
    }

    .doc-name-btn:hover {
      background: rgba(10, 132, 255, 0.25);
      border-color: var(--primary-color);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .visit-badge {
      display: inline-block;
      background: rgba(10, 132, 255, 0.18);
      color: #70b5ff;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 8px;
      margin-top: 6px;
      border: 1px solid rgba(10, 132, 255, 0.3);
    }

    /* Modal Styling (iOS Liquid Glass Overlay) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: rgba(30, 30, 35, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      padding: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      animation: modalUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalUp {
      from { transform: scale(0.95) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      font-size: 18px;
      color: #f5f5f7;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 16px;
      color: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .details-list {
      list-style: none;
      margin-bottom: 22px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .details-list::-webkit-scrollbar {
      width: 4px;
    }
    .details-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .details-list li {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
    }

    .details-list span.key {
      color: var(--secondary-text);
      font-weight: 400;
    }

    .details-list span.val {
      text-align: right;
      color: #f5f5f7;
      font-weight: 500;
    }

    /* Calendar Form */
    .calendar-form label {
      display: block;
      font-size: 13px;
      color: var(--secondary-text);
      margin-bottom: 8px;
    }

    .calendar-form input[type="date"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
      color-scheme: dark;
    }

    .saved-visits-list {
      margin-top: 12px;
      max-height: 140px;
      overflow-y: auto;
    }

    .saved-visit-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .delete-visit-btn {
      background: rgba(255, 69, 58, 0.2);
      color: #ff453a;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
    }

    .delete-visit-btn:hover {
      background: rgba(255, 69, 58, 0.4);
    }
  </style>
</head>

    let selectedDoctorId = null;

    // Simulate Apple TV Loading Effect
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader-wrapper');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 600);
        setupCitySelection();
      }, 1000);
    });

    // Populate City Buttons
    function setupCitySelection() {
      const cityContainer = document.getElementById('city-buttons');
      cityContainer.innerHTML = '';

      const cities = [...new Set(globalData.map(row => row['City']).filter(Boolean))].sort();

      cities.forEach(city => {
        const btn = document.createElement('button');
        btn.className = 'city-btn';
        btn.textContent = city;
        btn.onclick = () => {
          document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          displayDoctors(city);
        };
        cityContainer.appendChild(btn);
      });
    }

    // Display Doctor List Filtered by City
    function displayDoctors(city) {
      const tbody = document.getElementById('doctor-tbody');
      tbody.innerHTML = '';

      const filtered = globalData.filter(row => row['City'] === city);

      filtered.forEach((doc, index) => {
        const docName = doc['Doctor Name'] || `Doctor ${index + 1}`;
        const docId = `${city}_${docName}`.replace(/\s+/g, '_');

        const tr = document.createElement('tr');

        // Serial No
        const tdIndex = document.createElement('td');
        tdIndex.textContent = index + 1;
        tdIndex.style.color = 'var(--secondary-text)';

        // Name Button + Saved Visit Badges
        const tdName = document.createElement('td');
        const nameBtn = document.createElement('button');
        nameBtn.className = 'doc-name-btn';
        nameBtn.textContent = docName;
        nameBtn.onclick = () => openCalendarModal(docId, docName);

        const visits = getVisits(docId);
        tdName.appendChild(nameBtn);
        if (visits.length > 0) {
          const badge = document.createElement('div');
          badge.className = 'visit-badge';
          badge.textContent = `Last Visited: ${visits[visits.length - 1]}`;
          tdName.appendChild(badge);
        }

        // Details Button
        const tdAction = document.createElement('td');
        const detailsBtn = document.createElement('button');
        detailsBtn.className = 'btn btn-secondary';
        detailsBtn.textContent = 'Details';
        detailsBtn.onclick = () => openDetailsModal(doc);
        tdAction.appendChild(detailsBtn);

        tr.appendChild(tdIndex);
        tr.appendChild(tdName);
        tr.appendChild(tdAction);
        tbody.appendChild(tr);
      });

      document.getElementById('doctor-list-title').textContent = `Doctors in ${city} (${filtered.length})`;
      document.getElementById('doctor-card').style.display = 'block';
    }

    // Modal: Open Details
    function openDetailsModal(doc) {
      const content = document.getElementById('modal-details-content');
      content.innerHTML = '';

      Object.entries(doc).forEach(([key, val]) => {
        if (val !== undefined && val !== null && val !== '') {
          const li = document.createElement('li');
          li.innerHTML = `<span class="key">${key}:</span> <span class="val">${val}</span>`;
          content.appendChild(li);
        }
      });

      document.getElementById('details-modal').classList.add('open');
    }

    // Modal: Open Calendar / Log Visit
    function openCalendarModal(docId, docName) {
      selectedDoctorId = docId;
      document.getElementById('cal-doc-name').textContent = `Log Visit: ${docName}`;
      renderSavedVisits();
      document.getElementById('calendar-modal').classList.add('open');
    }

    // Handle Form Submit (Save Visit Permanently in LocalStorage)
    document.getElementById('visit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const dateVal = document.getElementById('visit-date').value;
      if (!dateVal || !selectedDoctorId) return;

      const visits = getVisits(selectedDoctorId);
      visits.push(dateVal);
      localStorage.setItem(`visits_${selectedDoctorId}`, JSON.stringify(visits));

      document.getElementById('visit-date').value = '';
      renderSavedVisits();

      // Refresh doctor list to update badges instantly
      const activeCityBtn = document.querySelector('.city-btn.active');
      if (activeCityBtn) activeCityBtn.click();
    });

    function getVisits(docId) {
      const saved = localStorage.getItem(`visits_${docId}`);
      return saved ? JSON.parse(saved) : [];
    }

    function renderSavedVisits() {
      const container = document.getElementById('saved-visits-container');
      container.innerHTML = '';
      const visits = getVisits(selectedDoctorId);

      if (visits.length === 0) {
        container.innerHTML = '<p style="font-size: 12px; color: var(--secondary-text);">No visits logged yet.</p>';
        return;
      }

      visits.forEach((v, idx) => {
        const item = document.createElement('div');
        item.className = 'saved-visit-item';
        
        const textSpan = document.createElement('span');
        textSpan.innerHTML = `Visit ${idx + 1}: <strong style="color: #fff;">${v}</strong>`;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-visit-btn';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = () => deleteVisit(selectedDoctorId, idx);

        item.appendChild(textSpan);
        item.appendChild(deleteBtn);
        container.appendChild(item);
      });
    }

    // Delete Visit Date feature if filled by mistake
    function deleteVisit(docId, index) {
      let visits = getVisits(docId);
      visits.splice(index, 1);
      localStorage.setItem(`visits_${docId}`, JSON.stringify(visits));
      renderSavedVisits();

      // Refresh doctor list to update badges
      const activeCityBtn = document.querySelector('.city-btn.active');
      if (activeCityBtn) activeCityBtn.click();
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }
  </script>
